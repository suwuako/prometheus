name: Build and Test
on: [push, pull_request]

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Debian doesn't have a samurai package, and the time it would take to compile it would eclipse the time we would save by using it.
      - name: Install dependencies
        run: sudo apt install meson ninja-build nasm build-essential curl -y

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          cargo build --release

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
